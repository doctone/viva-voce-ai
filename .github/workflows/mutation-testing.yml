name: Mutation Testing

on:
  pull_request:
    paths:
      - "apps/web/src/features/**"
      - "apps/web/stryker.config.mjs"

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The mutation score is a work-in-progress metric, not a merge gate yet: some
      # existing features files (e.g. untested Supabase wiring) score below the
      # configured break threshold. Report the score without failing the build
      # until coverage of business logic catches up.
      - name: Run mutation testing
        run: pnpm test:mutate
        continue-on-error: true

      - name: Upload Stryker HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-mutation-report
          path: apps/web/reports/mutation
          retention-days: 14
